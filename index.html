<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Banking App</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  svg { width: 24px; height: 24px; display: block; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif;
    color: #fff;
  }
  #app { width: 100%; max-width: 480px; min-height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column; position: relative; }

  .topbar { display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 20px 16px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: #1c1c1e; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .icon-btn svg { width: 20px; height: 20px; }
  .topbar h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.3px; }
  .topbar-right { display: flex; gap: 8px; }

  .avatar { border-radius: 50%; flex-shrink: 0; }
  .avatar-0 { background: linear-gradient(160deg,#6b8ba4 0%,#8fae8a 35%,#c9b88a 70%,#3a4a52 100%); }
  .avatar-1 { background: linear-gradient(160deg,#5f7f9c 0%,#7fa688 40%,#b8a878 75%,#2f3c44 100%); }
  .avatar-2 { background: linear-gradient(160deg,#7391aa 0%,#96b491 35%,#cdbd90 70%,#41525a 100%); }

  .account-list { flex: 1; padding: 8px 16px 100px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .account-card { background: #1c1c1e; border-radius: 20px; padding: 13px 16px;
    display: flex; align-items: center; gap: 13px; cursor: pointer; border: none; text-align: left; width: 100%; color: #fff; }
  .account-card .avatar { width: 52px; height: 52px; }
  .account-info { flex: 1; min-width: 0; }
  .account-name { font-size: 16px; font-weight: 500; margin-bottom: 2px; }
  .account-balance { font-size: 16px; font-weight: 600; line-height: 1.1; margin-bottom: 1px; }
  .account-available { font-size: 13px; color: #8e8e93; }
  .account-card > svg { width: 20px; height: 20px; flex-shrink: 0; }

  .bottom-nav-wrap { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 12px 22px;
    background: linear-gradient(transparent, #000 40%); }
  .bottom-nav { background: #161618; border-radius: 30px; border: 1px solid #2a2a2c;
    display: flex; justify-content: space-around; align-items: center; padding: 10px 6px; }
  .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center;
    gap: 4px; color: #fff; cursor: pointer; padding: 4px 6px; border-radius: 18px; }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn span { font-size: 12px; font-weight: 500; }
  .nav-btn.active { color: #3b9dff; background: rgba(59,157,255,0.12); }

  /* detail view */
  .detail-avatar { width: 112px; height: 112px; }
  .detail-hero { display: flex; flex-direction: column; align-items: center; padding: 24px 0 20px; }
  .account-number { display: flex; align-items: center; gap: 6px; margin-top: 24px; color: #0a84ff;
    font-size: 16px; font-weight: 500; letter-spacing: 0.5px; }
  .account-number svg { width: 14px; height: 14px; }
  .big-balance { font-size: 31px; font-weight: 600; margin-top: 10px; letter-spacing: -1px; }
  .big-available { font-size: 15px; color: #8e8e93; margin-top: 4px; }

  .actions-row { display: flex; justify-content: space-between; padding: 12px 4px 28px; }
  .action-btn-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .action-btn { width: 56px; height: 56px; border-radius: 50%; background: #1c1c1e; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .action-btn svg { width: 22px; height: 22px; }
  .action-btn-wrap span { font-size: 13px; color: #e5e5e7; }

  .detail-scroll { flex: 1; overflow-y: auto; padding: 0 16px 100px; }
  .tx-date { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .tx-group { margin-bottom: 24px; }
  .tx-card { background: #1c1c1e; border-radius: 20px; overflow: hidden; }
  .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; }
  .tx-row .label { font-size: 16px; color: #fff; }
  .tx-row .amount { font-size: 16px; font-weight: 600; }
  .amount.out { color: #fff; }
  .amount.in { color: #32d74b; }
  .tx-divider { height: 1px; background: #2c2c2e; margin: 0 18px; }
  .empty-tx { color: #8e8e93; font-size: 15px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- inline SVG icons ---------- */
function svg(paths, opts) {
  opts = opts || {};
  var stroke = opts.color || "#fff";
  var fill = opts.fill || "none";
  var sw = opts.strokeWidth || 1.8;
  var size = opts.size || 24;
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="' + fill + '" stroke="' + stroke +
    '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round" style="width:' + size + 'px;height:' + size + 'px;flex-shrink:0;display:block;">' + paths + '</svg>';
}
var ICONS = {
  user: function(o){ return svg('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>', o); },
  bell: function(o){ return svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>', o); },
  lock: function(o){ return svg('<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', o); },
  chevronRight: function(o){ return svg('<path d="m9 18 6-6-6-6"/>', o); },
  chevronLeft: function(o){ return svg('<path d="m15 18-6-6 6-6"/>', o); },
  search: function(o){ return svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', o); },
  externalLink: function(o){ return svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>', o); },
  circleDollar: function(o){ return svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M14.5 9.3a2.3 2.3 0 0 0-2.3-1.8h-.4a2 2 0 0 0 0 4h.4a2 2 0 0 1 0 4h-.4a2.3 2.3 0 0 1-2.3-1.8"/>', o); },
  arrowLeftRight: function(o){ return svg('<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>', o); },
  fileText: function(o){ return svg('<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>', o); },
  moreHorizontal: function(o){ return svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>', {color:o&&o.color, fill:(o&&o.color)||"#fff"}); },
  dollarSign: function(o){ return svg('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>', o); },
  send: function(o){ return svg('<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>', o); },
  refreshCw: function(o){ return svg('<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>', o); },
  creditCard: function(o){ return svg('<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>', o); },
  plus: function(o){ return svg('<path d="M5 12h14"/><path d="M12 5v14"/>', o); }
};

/* ---------- data ---------- */
var accounts = [
  { id: 1, name: "Gas Money", balance: 0.02, number: "06-0574-0887499-05" },
  { id: 2, name: "Hoon Money", balance: 0.01, number: "06-0574-0887499-04" },
  { id: 3, name: "Serious Saver", balance: 0.00, number: "06-0574-0887499-03" },
  { id: 4, name: "Apple Pay", balance: 76.00, number: "06-0574-0887499-01" },
  { id: 5, name: "Mow Zone", balance: 1936.42, number: "06-0574-0887499-02" }
];

var PAYER_GROUPS = [
  ["Emily Carter", "James Bennett", "Olivia Turner", "Michael Reed"],
  ["Sophia Ramirez", "Daniel Foster", "Ava Mitchell", "Ethan Brooks"],
  ["Grace Coleman", "Benjamin Hayes", "Chloe Sanders", "Lucas Parker"],
  ["Isabella Cooper", "Henry Watson", "Mia Sullivan", "Jack Nolan"]
];
var PAYMENT_AMOUNTS = [70, 75, 80];

function getRecentMondays(count) {
  var dates = [];
  var d = new Date();
  var diffToMonday = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - diffToMonday);
  d.setHours(12, 0, 0, 0);
  for (var i = 0; i < count; i++) {
    dates.push(new Date(d));
    d.setDate(d.getDate() - 7);
  }
  return dates;
}

function formatTxDate(d) {
  var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
}

function buildMowZoneTransactions() {
  var mondays = getRecentMondays(13);
  var incoming = mondays.map(function(dateObj, weekIndex) {
    var group = PAYER_GROUPS[weekIndex % 4];
    var items = group.map(function(name, i) {
      return { text: "From: " + name, amount: PAYMENT_AMOUNTS[(weekIndex + i) % 3] };
    });
    return { dateObj: dateObj, items: items };
  });

  var outgoing = [
    { dateObj: new Date(2026, 7, 20), items: [{ text: "To: 06-0574-0887499-00", amount: -10 }] },
    { dateObj: new Date(2026, 7, 19), items: [
        { text: "To: 06-0574-0887499-00", amount: -10 },
        { text: "To: 06-0574-0887499-00", amount: -5 }
      ] }
  ];

  return outgoing.concat(incoming)
    .sort(function(a, b){ return b.dateObj - a.dateObj; })
    .map(function(g){ return { date: formatTxDate(g.dateObj), items: g.items }; });
}

var transactionsByAccount = { 5: buildMowZoneTransactions() };

function fmt(n) {
  return Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ---------- state ---------- */
var state = { view: "list", selectedId: null, activeTab: "Accounts" };

var TABS = [
  { name: "Accounts", icon: "dollarSign" },
  { name: "Payments", icon: "send" },
  { name: "Transfer", icon: "refreshCw" },
  { name: "Cards", icon: "creditCard" },
  { name: "Apply", icon: "plus" }
];

/* ---------- render ---------- */
function renderTopBar() {
  return (
    '<div class="topbar">' +
      '<button class="icon-btn" id="profile-btn">' + ICONS.user({color:"#fff",strokeWidth:1.8,size:20}) + '</button>' +
      '<h1>Accounts</h1>' +
      '<div class="topbar-right">' +
        '<button class="icon-btn">' + ICONS.bell({color:"#fff",strokeWidth:1.8,size:20}) + '</button>' +
        '<button class="icon-btn">' + ICONS.lock({color:"#fff",strokeWidth:1.8,size:20}) + '</button>' +
      '</div>' +
    '</div>'
  );
}

function renderAccountList() {
  var cardsHtml = accounts.map(function(acct, i) {
    return (
      '<button class="account-card" data-id="' + acct.id + '">' +
        '<div class="avatar avatar-' + (i % 3) + '" style="width:52px;height:52px;"></div>' +
        '<div class="account-info">' +
          '<div class="account-name">' + acct.name + '</div>' +
          '<div class="account-balance">$' + fmt(acct.balance) + '</div>' +
          '<div class="account-available">$' + fmt(acct.balance) + ' Available</div>' +
        '</div>' +
        ICONS.chevronRight({color:"#5a5a5e",strokeWidth:1.8,size:20}) +
      '</button>'
    );
  }).join("");

  return renderTopBar() + '<div class="account-list">' + cardsHtml + '</div>';
}

function renderActionBtn(iconKey, label) {
  return (
    '<div class="action-btn-wrap">' +
      '<button class="action-btn">' + ICONS[iconKey]({color:"#fff",strokeWidth:1.7,size:22}) + '</button>' +
      '<span>' + label + '</span>' +
    '</div>'
  );
}

function renderDetail(account) {
  var groups = transactionsByAccount[account.id] || [];
  var idx = accounts.findIndex(function(a){ return a.id === account.id; });

  var top = (
    '<div class="topbar">' +
      '<button class="icon-btn" id="back-btn">' + ICONS.chevronLeft({color:"#fff",strokeWidth:2,size:20}) + '</button>' +
      '<h1 style="font-size:20px;">' + account.name + '</h1>' +
      '<button class="icon-btn">' + ICONS.search({color:"#0a84ff",strokeWidth:2,size:20}) + '</button>' +
    '</div>'
  );

  var hero = (
    '<div class="detail-hero">' +
      '<div class="avatar avatar-' + (idx % 3) + ' detail-avatar"></div>' +
      '<div class="account-number">' +
        '<span>' + account.number + '</span>' + ICONS.externalLink({color:"#0a84ff",strokeWidth:2,size:14}) +
      '</div>' +
      '<div class="big-balance">$' + fmt(account.balance) + '</div>' +
      '<div class="big-available">$' + fmt(account.balance) + ' Available</div>' +
    '</div>'
  );

  var actions = (
    '<div class="actions-row">' +
      renderActionBtn("circleDollar", "Pay") +
      renderActionBtn("arrowLeftRight", "Transfer") +
      renderActionBtn("fileText", "Details") +
      renderActionBtn("moreHorizontal", "More") +
    '</div>'
  );

  var txHtml;
  if (groups.length === 0) {
    txHtml = '<div class="empty-tx">No transactions yet</div>';
  } else {
    txHtml = groups.map(function(group) {
      var rows = group.items.map(function(tx, ti) {
        var cls = tx.amount < 0 ? "out" : "in";
        var sign = tx.amount < 0 ? "-" : "+";
        var divider = ti < group.items.length - 1 ? '<div class="tx-divider"></div>' : "";
        return (
          '<div class="tx-row">' +
            '<span class="label">' + tx.text + '</span>' +
            '<span class="amount ' + cls + '">' + sign + '$' + fmt(tx.amount) + '</span>' +
          '</div>' + divider
        );
      }).join("");
      return (
        '<div class="tx-group">' +
          '<div class="tx-date">' + group.date + '</div>' +
          '<div class="tx-card">' + rows + '</div>' +
        '</div>'
      );
    }).join("");
  }

  return top + '<div class="detail-scroll">' + hero + actions + txHtml + '</div>';
}

function renderBottomNav() {
  var btns = TABS.map(function(tab) {
    var active = state.activeTab === tab.name;
    return (
      '<button class="nav-btn ' + (active ? "active" : "") + '" data-tab="' + tab.name + '">' +
        ICONS[tab.icon]({color: active ? "#3b9dff" : "#fff", strokeWidth: 1.8, size: 22}) +
        '<span>' + tab.name + '</span>' +
      '</button>'
    );
  }).join("");
  return '<div class="bottom-nav-wrap"><div class="bottom-nav">' + btns + '</div></div>';
}

function render() {
  var app = document.getElementById("app");
  var html;
  if (state.view === "detail" && state.selectedId != null) {
    var acct = accounts.find(function(a){ return a.id === state.selectedId; });
    html = renderDetail(acct);
  } else {
    html = renderAccountList();
  }
  html += renderBottomNav();
  app.innerHTML = html;
  attachEvents();
}

function attachEvents() {
  var cards = document.querySelectorAll(".account-card");
  cards.forEach(function(card) {
    card.addEventListener("click", function() {
      state.selectedId = parseInt(card.getAttribute("data-id"), 10);
      state.view = "detail";
      render();
    });
  });

  var backBtn = document.getElementById("back-btn");
  if (backBtn) {
    backBtn.addEventListener("click", function() {
      state.view = "list";
      render();
    });
  }

  var navBtns = document.querySelectorAll(".nav-btn");
  navBtns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      state.activeTab = btn.getAttribute("data-tab");
      state.view = "list";
      render();
    });
  });
}

render();
</script>
</body>
</html>
