<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Banking App</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; }
  #root { min-height: 100dvh; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---------- inline icon set (no external deps) ---------- */
function Icon({ children, size = 22, strokeWidth = 1.8, color = "#fff", fill = "none" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>
  );
}
const UserIcon = (p) => <Icon {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
const BellIcon = (p) => <Icon {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></Icon>;
const LockIcon = (p) => <Icon {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
const ChevronRightIcon = (p) => <Icon {...p}><path d="m9 18 6-6-6-6"/></Icon>;
const ChevronLeftIcon = (p) => <Icon {...p}><path d="m15 18-6-6 6-6"/></Icon>;
const SearchIcon = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>;
const ExternalLinkIcon = (p) => <Icon {...p}><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></Icon>;
const CircleDollarIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M14.5 9.3a2.3 2.3 0 0 0-2.3-1.8h-.4a2 2 0 0 0 0 4h.4a2 2 0 0 1 0 4h-.4a2.3 2.3 0 0 1-2.3-1.8"/></Icon>;
const ArrowLeftRightIcon = (p) => <Icon {...p}><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></Icon>;
const FileTextIcon = (p) => <Icon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></Icon>;
const MoreHorizontalIcon = (p) => <Icon {...p} fill={p.color || "#fff"}><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></Icon>;
const DollarSignIcon = (p) => <Icon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
const SendIcon = (p) => <Icon {...p}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></Icon>;
const RefreshCwIcon = (p) => <Icon {...p}><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></Icon>;
const CreditCardIcon = (p) => <Icon {...p}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></Icon>;
const PlusIcon = (p) => <Icon {...p}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;

/* ---------- data ---------- */
const AVATAR_GRADIENTS = [
  "linear-gradient(160deg,#6b8ba4 0%,#8fae8a 35%,#c9b88a 70%,#3a4a52 100%)",
  "linear-gradient(160deg,#5f7f9c 0%,#7fa688 40%,#b8a878 75%,#2f3c44 100%)",
  "linear-gradient(160deg,#7391aa 0%,#96b491 35%,#cdbd90 70%,#41525a 100%)",
];

function Avatar({ seed, size = 52 }) {
  const idx = seed % AVATAR_GRADIENTS.length;
  return (
    <div style={{
      width: size, height: size, borderRadius: "50%",
      background: AVATAR_GRADIENTS[idx], flexShrink: 0,
    }} />
  );
}

const initialAccounts = [
  { id: 1, name: "Gas Money", balance: 0.02, number: "06-0574-0887499-05" },
  { id: 2, name: "Hoon Money", balance: 0.01, number: "06-0574-0887499-04" },
  { id: 3, name: "Serious Saver", balance: 0.0, number: "06-0574-0887499-03" },
  { id: 4, name: "Apple Pay", balance: 76.0, number: "06-0574-0887499-01" },
  { id: 5, name: "Mow Zone", balance: 1936.42, number: "06-0574-0887499-02" },
];

const PAYER_GROUPS = [
  ["Emily Carter", "James Bennett", "Olivia Turner", "Michael Reed"],
  ["Sophia Ramirez", "Daniel Foster", "Ava Mitchell", "Ethan Brooks"],
  ["Grace Coleman", "Benjamin Hayes", "Chloe Sanders", "Lucas Parker"],
  ["Isabella Cooper", "Henry Watson", "Mia Sullivan", "Jack Nolan"],
];
const PAYMENT_AMOUNTS = [70, 75, 80];

function getRecentMondays(count) {
  const dates = [];
  const d = new Date();
  const diffToMonday = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - diffToMonday);
  d.setHours(12, 0, 0, 0);
  for (let i = 0; i < count; i++) {
    dates.push(new Date(d));
    d.setDate(d.getDate() - 7);
  }
  return dates;
}

function formatTxDate(d) {
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function buildMowZoneTransactions() {
  const mondays = getRecentMondays(13);
  const incoming = mondays.map((dateObj, weekIndex) => {
    const group = PAYER_GROUPS[weekIndex % 4];
    const items = group.map((name, i) => ({
      text: `From: ${name}`,
      amount: PAYMENT_AMOUNTS[(weekIndex + i) % 3],
    }));
    return { dateObj, items };
  });

  const outgoing = [
    { dateObj: new Date(2026, 7, 20), items: [{ text: "To: 06-0574-0887499-00", amount: -10 }] },
    { dateObj: new Date(2026, 7, 19), items: [
        { text: "To: 06-0574-0887499-00", amount: -10 },
        { text: "To: 06-0574-0887499-00", amount: -5 },
      ] },
  ];

  return [...outgoing, ...incoming]
    .sort((a, b) => b.dateObj - a.dateObj)
    .map((g) => ({ date: formatTxDate(g.dateObj), items: g.items }));
}

const transactionsByAccount = { 5: buildMowZoneTransactions() };

const fmt = (n) => Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---------- shared components ---------- */
function TopIconButton({ children, size = 50, onClick }) {
  return (
    <button onClick={onClick} style={{
      width: size, height: size, borderRadius: "50%", background: "#1c1c1e",
      border: "none", display: "flex", alignItems: "center", justifyContent: "center",
      cursor: "pointer", flexShrink: 0,
    }}>
      {children}
    </button>
  );
}

function ActionButton({ icon: IconComp, label }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, flex: 1 }}>
      <button style={{
        width: 56, height: 56, borderRadius: "50%", background: "#1c1c1e",
        border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
      }}>
        <IconComp size={22} color="#fff" strokeWidth={1.7} />
      </button>
      <span style={{ fontSize: 13, color: "#e5e5e7" }}>{label}</span>
    </div>
  );
}

function AccountDetail({ account, onBack }) {
  const groups = transactionsByAccount[account.id] || [];
  return (
    <React.Fragment>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "24px 20px 20px" }}>
        <TopIconButton onClick={onBack}><ChevronLeftIcon size={24} color="#fff" strokeWidth={2} /></TopIconButton>
        <h1 style={{ fontSize: 24, fontWeight: 600, margin: 0, letterSpacing: -0.3 }}>{account.name}</h1>
        <TopIconButton><SearchIcon size={20} color="#0a84ff" strokeWidth={2} /></TopIconButton>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "0 16px 100px" }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "24px 0 20px" }}>
          <Avatar seed={account.id} size={112} />
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 24, color: "#0a84ff", fontSize: 16, fontWeight: 500, letterSpacing: 0.5 }}>
            <span>{account.number}</span>
            <ExternalLinkIcon size={14} strokeWidth={2} color="#0a84ff" />
          </div>
          <div style={{ fontSize: 52, fontWeight: 600, marginTop: 10, letterSpacing: -1 }}>${fmt(account.balance)}</div>
          <div style={{ fontSize: 15, color: "#8e8e93", marginTop: 4 }}>${fmt(account.balance)} Available</div>
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 4px 28px" }}>
          <ActionButton icon={CircleDollarIcon} label="Pay" />
          <ActionButton icon={ArrowLeftRightIcon} label="Transfer" />
          <ActionButton icon={FileTextIcon} label="Details" />
          <ActionButton icon={MoreHorizontalIcon} label="More" />
        </div>

        {groups.length === 0 ? (
          <div style={{ color: "#8e8e93", fontSize: 15, textAlign: "center", padding: "40px 0" }}>No transactions yet</div>
        ) : (
          groups.map((group, gi) => (
            <div key={gi} style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>{group.date}</div>
              <div style={{ background: "#1c1c1e", borderRadius: 20, overflow: "hidden" }}>
                {group.items.map((tx, ti) => (
                  <div key={ti}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 18px" }}>
                      <span style={{ fontSize: 16, color: "#fff" }}>{tx.text}</span>
                      <span style={{ fontSize: 16, fontWeight: 600, color: tx.amount < 0 ? "#fff" : "#32d74b" }}>
                        {tx.amount < 0 ? "-" : "+"}${fmt(tx.amount)}
                      </span>
                    </div>
                    {ti < group.items.length - 1 && (
                      <div style={{ height: 1, background: "#2c2c2e", margin: "0 18px" }} />
                    )}
                  </div>
                ))}
              </div>
            </div>
          ))
        )}
      </div>
    </React.Fragment>
  );
}

function BankingApp() {
  const [accounts] = useState(initialAccounts);
  const [activeTab, setActiveTab] = useState("Accounts");
  const [view, setView] = useState("list");
  const [selectedId, setSelectedId] = useState(null);

  const openAccount = (id) => { setSelectedId(id); setView("detail"); };

  const tabs = [
    { name: "Accounts", icon: DollarSignIcon },
    { name: "Payments", icon: SendIcon },
    { name: "Transfer", icon: RefreshCwIcon },
    { name: "Cards", icon: CreditCardIcon },
    { name: "Apply", icon: PlusIcon },
  ];

  const selectedAccount = accounts.find((a) => a.id === selectedId);

  return (
    <div style={{
      background: "#000", width: "100%", maxWidth: 480, minHeight: "100dvh",
      margin: "0 auto", fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif",
      color: "#fff", display: "flex", flexDirection: "column", position: "relative",
    }}>
      {view === "detail" && selectedAccount ? (
        <AccountDetail account={selectedAccount} onBack={() => setView("list")} />
      ) : (
        <React.Fragment>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "24px 20px 20px" }}>
            <TopIconButton><UserIcon size={22} color="#fff" strokeWidth={1.8} /></TopIconButton>
            <h1 style={{ fontSize: 28, fontWeight: 600, margin: 0, letterSpacing: -0.3 }}>Accounts</h1>
            <div style={{ display: "flex", gap: 10 }}>
              <TopIconButton><BellIcon size={20} color="#fff" strokeWidth={1.8} /></TopIconButton>
              <TopIconButton><LockIcon size={19} color="#fff" strokeWidth={1.8} /></TopIconButton>
            </div>
          </div>

          <div style={{ flex: 1, padding: "8px 16px 100px", display: "flex", flexDirection: "column", gap: 10, overflowY: "auto" }}>
            {accounts.map((acct, i) => (
              <div key={acct.id} onClick={() => openAccount(acct.id)} style={{
                background: "#1c1c1e", borderRadius: 20, padding: "13px 16px",
                display: "flex", alignItems: "center", gap: 13, cursor: "pointer",
              }}>
                <Avatar seed={i} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 16, fontWeight: 500, marginBottom: 2 }}>{acct.name}</div>
                  <div style={{ fontSize: 26, fontWeight: 600, lineHeight: 1.1, marginBottom: 1 }}>${fmt(acct.balance)}</div>
                  <div style={{ fontSize: 13, color: "#8e8e93" }}>${fmt(acct.balance)} Available</div>
                </div>
                <ChevronRightIcon size={20} color="#5a5a5e" />
              </div>
            ))}
          </div>
        </React.Fragment>
      )}

      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "10px 12px 22px", background: "linear-gradient(transparent, #000 40%)" }}>
        <div style={{ background: "#161618", borderRadius: 30, border: "1px solid #2a2a2c", display: "flex", justifyContent: "space-around", alignItems: "center", padding: "10px 6px" }}>
          {tabs.map(({ name, icon: IconComp }) => {
            const active = activeTab === name;
            return (
              <button key={name} onClick={() => { setActiveTab(name); setView("list"); }} style={{
                background: active ? "rgba(59,157,255,0.12)" : "none", border: "none",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                color: active ? "#3b9dff" : "#fff", cursor: "pointer", padding: "4px 6px", borderRadius: 18,
              }}>
                <IconComp size={22} strokeWidth={1.8} color={active ? "#3b9dff" : "#fff"} />
                <span style={{ fontSize: 12, fontWeight: 500 }}>{name}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BankingApp />);
</script>
</body>
</html>
